[build]
  command = "bash scripts/netlify-build.sh"
  publish = "tejido-social-web/build"

[build.environment]
  NODE_VERSION = "20"

# "Comisiones temáticas" was renamed to "Pilares de desarrollo" (0.4.4).
# The old URLs were public, so keep them resolving instead of 404ing.
[[redirects]]
  from = "/docs/organismos/comisiones-tematicas"
  to = "/docs/organismos/pilares-desarrollo"
  status = 301

[[redirects]]
  from = "/docs/organismos/comisiones-tematicas/*"
  to = "/docs/organismos/pilares-desarrollo/:splat"
  status = 301

# CARS's initiatives page was renamed to "causas" when the section was
# restructured, before the URL was ever published — kept anyway so the
# earlier path doesn't 404 for anyone who has it.
[[redirects]]
  from = "/cars/iniciativas"
  to = "/cars/causas/"
  status = 301

# The collective's own term is "comisiones", not "comités" — the page was
# renamed to match before the URL was published.
[[redirects]]
  from = "/cars/como-nos-organizamos/comites"
  to = "/cars/como-nos-organizamos/comisiones"
  status = 301
